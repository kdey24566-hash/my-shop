<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter — Shop Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1B2A4A;
  --ink-2:#28395c;
  --paper:#F7F5F0;
  --surface:#FFFEFB;
  --rule:#DAD4C5;
  --rule-2:#EAE5D8;
  --accent:#2E6B4F;
  --accent-2:#3F8F5F;
  --rust:#B4532A;
  --rust-2:#F3E2D8;
  --text:#20262f;
  --text-dim:#6b7280;
  --gold:#9C7A2E;
  --radius:10px;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--text); font-family:var(--sans);
  font-size:14px; -webkit-font-smoothing:antialiased;
}
::selection{ background: var(--accent-2); color:#fff; }
button{font-family:inherit; cursor:pointer;}
input, select, textarea{font-family:inherit; font-size:14px;}
table{border-collapse:collapse; width:100%;}
.num, .money{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; }
a{color:var(--accent);}

/* ---------- Login ---------- */
#login-screen{
  position:fixed; inset:0; background:
    linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  display:flex; align-items:center; justify-content:center; z-index:500;
}
.login-card{
  background:var(--surface); width:380px; max-width:92vw; border-radius:14px;
  padding:36px 32px; box-shadow:0 30px 60px rgba(0,0,0,.35);
}
.login-brand{ text-align:center; margin-bottom:22px; }
.login-brand .mark{
  width:52px; height:52px; margin:0 auto 12px; border-radius:12px;
  background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:24px; font-weight:700;
}
.login-brand h1{ font-family:var(--serif); font-size:22px; margin:0; letter-spacing:.2px;}
.login-brand p{ color:var(--text-dim); font-size:12.5px; margin:4px 0 0;}
.user-pick{ display:grid; gap:8px; margin-bottom:18px; }
.user-btn{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  border:1px solid var(--rule); background:#fff; text-align:left;
}
.user-btn:hover{ border-color:var(--accent); }
.user-avatar{
  width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; flex:none;
}
.user-btn .role-tag{ margin-left:auto; font-size:11px; color:var(--text-dim); border:1px solid var(--rule); padding:2px 8px; border-radius:20px; }
.pin-pad{ display:none; }
.pin-pad.show{ display:block; }
.pin-dots{ display:flex; justify-content:center; gap:10px; margin:14px 0 18px; }
.pin-dots span{ width:12px; height:12px; border-radius:50%; border:1.5px solid var(--ink); }
.pin-dots span.filled{ background:var(--ink); }
.pin-keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.pin-keys button{
  padding:14px 0; border-radius:10px; border:1px solid var(--rule); background:#fff;
  font-size:17px; font-family:var(--serif);
}
.pin-keys button:active{ background:var(--rule-2); }
.login-err{ color:var(--rust); font-size:12.5px; text-align:center; min-height:16px; margin-top:4px;}
.login-back{ text-align:center; margin-top:10px; }
.login-back button{ background:none; border:none; color:var(--text-dim); font-size:12.5px; text-decoration:underline;}
.setup-form label{ display:block; font-size:12px; color:var(--text-dim); margin:12px 0 4px; }
.setup-form input{ width:100%; padding:9px 10px; border:1px solid var(--rule); border-radius:8px; }

/* ---------- App shell ---------- */
#app{ display:none; min-height:100%; }
#app.show{ display:flex; }
#sidebar{
  width:212px; flex:none; background:var(--ink); color:#EDEFF3; min-height:100vh;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.side-brand{ padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,.1); }
.side-brand .name{ font-family:var(--serif); font-size:17px; }
.side-brand .biz{ font-size:11px; color:#B7C0D6; margin-top:2px; }
.side-nav{ padding:10px 10px; flex:1; overflow-y:auto; }
.side-nav .grp-label{ font-size:10.5px; color:#8894AE; margin:14px 10px 6px; letter-spacing:.3px; }
.side-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; color:#D7DCE8;
  text-decoration:none; font-size:13.5px; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.side-link .ic{ width:18px; text-align:center; font-family:var(--serif); }
.side-link:hover{ background:rgba(255,255,255,.06); }
.side-link.active{ background:var(--accent); color:#fff; }
.side-foot{ padding:12px 14px 16px; border-top:1px solid rgba(255,255,255,.1); }
.side-user{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#CBD3E3; }
.side-user .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent-2); }
.side-foot button{ margin-top:8px; background:none; border:1px solid rgba(255,255,255,.18); color:#D7DCE8; padding:6px 10px; border-radius:7px; font-size:12px; width:100%; }

#main{ flex:1; min-width:0; }
#topbar{
  position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--rule);
  padding:14px 24px; display:flex; align-items:center; gap:14px;
}
#topbar h2{ font-family:var(--serif); font-size:19px; margin:0; font-weight:600; }
#topbar .sub{ font-size:12px; color:var(--text-dim); }
.top-actions{ margin-left:auto; display:flex; gap:8px; }
#content{ padding:22px 24px 60px; }

/* ---------- Buttons ---------- */
.btn{
  padding:8px 14px; border-radius:8px; border:1px solid var(--rule); background:#fff; color:var(--text);
  font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:hover{ border-color:#c7c0ac; }
.btn-primary{ background:var(--ink); border-color:var(--ink); color:#fff; }
.btn-primary:hover{ background:var(--ink-2); }
.btn-accent{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-accent:hover{ background:var(--accent-2); }
.btn-danger{ background:#fff; border-color:var(--rust); color:var(--rust); }
.btn-danger:hover{ background:var(--rust-2); }
.btn-ghost{ background:none; border-color:transparent; color:var(--text-dim); }
.btn-sm{ padding:5px 9px; font-size:12px; border-radius:7px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---------- Cards / stats ---------- */
.grid{ display:grid; gap:14px; }
.g-4{ grid-template-columns:repeat(4,1fr); }
.g-3{ grid-template-columns:repeat(3,1fr); }
.g-2{ grid-template-columns:repeat(2,1fr); }
@media (max-width:1000px){ .g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);} }
.card{ background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); padding:16px 18px; }
.stat{ display:flex; flex-direction:column; gap:6px; }
.stat .lbl{ font-size:12px; color:var(--text-dim); }
.stat .val{ font-family:var(--serif); font-size:26px; }
.stat .delta{ font-size:11.5px; color:var(--accent-2); }
.stat.warn .val{ color:var(--rust); }
.section-title{ font-family:var(--serif); font-size:16px; margin:26px 0 10px; display:flex; align-items:center; justify-content:space-between; }

/* ---------- Tables (ledger style) ---------- */
.tbl-wrap{ background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; }
table.ledger{ width:100%; }
table.ledger th{
  text-align:left; font-size:11px; color:var(--text-dim); font-weight:600; padding:10px 14px;
  border-bottom:1.5px solid var(--rule); background:#F1EFE7; white-space:nowrap;
}
table.ledger td{ padding:10px 14px; border-bottom:1px solid var(--rule-2); font-size:13.5px; vertical-align:middle;}
table.ledger tbody tr:hover{ background:#FBFAF6; }
table.ledger tbody tr:last-child td{ border-bottom:none; }
.tbl-empty{ padding:40px 20px; text-align:center; color:var(--text-dim); font-size:13px; }
.badge{ font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--rule); display:inline-block; }
.badge-ok{ background:#E9F3EC; color:var(--accent); border-color:#CFE6D6; }
.badge-warn{ background:#FBEFE3; color:var(--rust); border-color:#F0D6C0; }
.badge-out{ background:#FBE7E4; color:#B23B2A; border-color:#F0C7C0; }
.badge-due{ background:#FDF3DA; color:var(--gold); border-color:#EFDCA0; }

/* ---------- Forms / Modal ---------- */
.modal-bg{ position:fixed; inset:0; background:rgba(20,24,32,.45); display:none; align-items:flex-start; justify-content:center; z-index:200; overflow-y:auto; padding:40px 16px;}
.modal-bg.show{ display:flex; }
.modal{ background:var(--surface); width:560px; max-width:100%; border-radius:14px; padding:22px 24px 24px; box-shadow:0 30px 60px rgba(0,0,0,.3); }
.modal.wide{ width:820px; }
.modal h3{ font-family:var(--serif); margin:0 0 4px; font-size:18px; }
.modal .desc{ font-size:12.5px; color:var(--text-dim); margin-bottom:16px; }
.modal .close{ float:right; background:none; border:none; font-size:20px; color:var(--text-dim); }
.field{ margin-bottom:13px; }
.field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px; }
.field input, .field select, .field textarea{
  width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:8px; background:#fff; color:var(--text);
}
.field textarea{ resize:vertical; min-height:56px; }
.field .hint{ font-size:11px; color:var(--text-dim); margin-top:3px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid var(--rule-2);}
.form-err{ color:var(--rust); font-size:12px; margin-top:4px; min-height:14px; }

/* ---------- Search / filters ---------- */
.toolbar{ display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.toolbar input[type=text], .toolbar input[type=search]{ padding:8px 12px; border:1px solid var(--rule); border-radius:8px; min-width:220px; background:#fff;}
.toolbar select{ padding:8px 10px; border:1px solid var(--rule); border-radius:8px; background:#fff;}
.spacer{ flex:1; }

/* ---------- POS ---------- */
.pos-wrap{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
@media (max-width:1100px){ .pos-wrap{ grid-template-columns:1fr; } }
.pos-scan{ padding:11px 14px; border:1.5px solid var(--ink); border-radius:9px; width:100%; font-size:14px; }
.scan-row{ display:flex; gap:8px; margin-bottom:12px; align-items:stretch; }
.scan-row .pos-scan{ margin-bottom:0; }
.scan-btn{
  flex:none; width:44px; border-radius:9px; border:1.5px solid var(--ink); background:var(--ink); color:#fff;
  font-size:17px; display:flex; align-items:center; justify-content:center;
}
.scan-btn:hover{ background:var(--ink-2); }
.field .scan-inline{ display:flex; gap:6px; }
.field .scan-inline input{ flex:1; }
.field .scan-inline button{ flex:none; }

/* ---------- Search-or-scan bar ---------- */
.search-scan{ display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--ink); border-radius:12px; padding:4px 4px 4px 12px; margin-bottom:12px; }
.search-scan .ss-ic{ color:var(--text-dim); font-size:17px; }
.search-scan input{ flex:1; min-width:0; border:none; outline:none; padding:10px 4px; font-size:14px; background:transparent; }
.ss-btn{ flex:none; border:none; background:var(--accent); color:#fff; font-weight:700; letter-spacing:.5px; font-size:12.5px; padding:11px 15px; border-radius:9px; display:flex; align-items:center; gap:6px; }
.ss-btn:hover{ background:var(--accent-2); }

/* ---------- Live scanner (full screen) ---------- */
body.scanning{ overflow:hidden; }
#scanner{ position:fixed; inset:0; z-index:400; background:#000; color:#fff; }
#scanner video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.sc-top{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:calc(12px + env(safe-area-inset-top)) 14px 14px; background:linear-gradient(180deg,rgba(0,0,0,.65),transparent); z-index:3; }
.sc-title{ font-family:var(--serif); font-size:16px; }
.sc-round{ width:42px; height:42px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:18px; }
.sc-round.on{ background:#fbbf24; color:#000; }
.sc-view{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:250px; pointer-events:none; }
.sc-frame{ position:relative; width:88%; max-width:520px; height:28vh; max-height:230px; border-radius:16px; box-shadow:0 0 0 100vmax rgba(0,0,0,.55); }
.sc-frame .cn{ position:absolute; width:28px; height:28px; border:4px solid #fff; transition:border-color .15s; }
.cn.tl{ top:-2px; left:-2px; border-right:none; border-bottom:none; border-top-left-radius:16px; }
.cn.tr{ top:-2px; right:-2px; border-left:none; border-bottom:none; border-top-right-radius:16px; }
.cn.bl{ bottom:-2px; left:-2px; border-right:none; border-top:none; border-bottom-left-radius:16px; }
.cn.br{ bottom:-2px; right:-2px; border-left:none; border-top:none; border-bottom-right-radius:16px; }
.sc-frame.ok .cn{ border-color:#4ade80; }
.sc-frame.bad .cn{ border-color:#f87171; }
.sc-line{ position:absolute; left:10px; right:10px; height:2px; background:#ef4444; box-shadow:0 0 12px #ef4444; animation:scanline 1.7s ease-in-out infinite alternate; }
.sc-tap{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px;
  background:rgba(20,24,32,.88); color:#fff; border:1.5px solid rgba(255,255,255,.35); border-radius:16px; padding:22px 28px; font-size:14px; }
.sc-tap:disabled{ opacity:.6; }
@keyframes scanline{ from{ top:10%; } to{ top:90%; } }
#scanner.bad video, #scanner.bad .sc-view{ display:none; }
.sc-sheet{ position:absolute; left:0; right:0; bottom:0; z-index:3; background:#fff; color:var(--text); border-radius:20px 20px 0 0; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow:0 -10px 30px rgba(0,0,0,.35); }
#scanner.bad .sc-sheet{ top:80px; bottom:auto; border-radius:20px; margin:0 12px; padding-bottom:16px; }
.sc-msg{ font-size:12.5px; color:var(--text-dim); text-align:center; margin-bottom:10px; min-height:17px; }
.sc-last{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:#E9F3EC; border:1px solid #CFE6D6; color:var(--accent); border-radius:10px; padding:10px 12px; font-size:13.5px; margin-bottom:10px; min-height:44px; }
.sc-last.empty{ background:var(--paper); border-color:var(--rule); color:var(--text-dim); }
.sc-plus{ border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:8px; padding:5px 12px; font-weight:700; font-size:14px; }
.sc-row{ display:flex; gap:8px; }
.sc-ghost{ flex:1; padding:13px 10px; border-radius:11px; border:1px solid var(--rule); background:#fff; color:var(--text); font-size:14px; }
.sc-done{ flex:1.4; padding:13px 10px; border-radius:11px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:700; }
.sc-typed{ display:flex; gap:8px; }
.sc-typed input{ flex:1; min-width:0; padding:12px; border:1px solid var(--rule); border-radius:10px; font-size:16px; }
.sc-unknown{ background:#FBEFE3; border:1px solid #F0D6C0; border-radius:10px; padding:12px; margin-bottom:10px; font-size:13.5px; line-height:1.45; }
.sc-problem h4{ margin:0 0 6px; font-family:var(--serif); font-size:17px; }
.sc-problem p{ margin:0 0 6px; font-size:13px; color:var(--text-dim); line-height:1.5; }
.sc-problem ol{ margin:8px 0 10px 18px; padding:0; font-size:13px; line-height:1.55; }
.sc-copy{ display:flex; gap:6px; margin:0 0 10px; }
.sc-copy input{ flex:1; min-width:0; padding:10px; border:1px solid var(--rule); border-radius:9px; font-size:12px; font-family:var(--mono); background:var(--paper); }
.sc-copy button{ flex:none; padding:0 16px; border:none; border-radius:9px; background:var(--ink); color:#fff; font-weight:700; }
.sc-tech{ font-size:11px; color:var(--text-dim); font-family:var(--mono); margin-bottom:8px; }
.sc-photo{ position:relative; display:block; text-align:center; font-size:12px; color:var(--text-dim); text-decoration:underline; margin-top:12px; overflow:hidden; padding:6px; }
.sc-photo input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; font-size:0; }
.pos-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-height:560px; overflow-y:auto; padding-right:4px;}
@media (max-width:700px){ .pos-grid{grid-template-columns:repeat(2,1fr);} }
.pos-item{ background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:11px; text-align:left; }
.pos-item:hover{ border-color:var(--accent); }
.pos-item .nm{ font-size:13px; font-weight:600; line-height:1.3; margin-bottom:4px;}
.pos-item .meta{ font-size:11px; color:var(--text-dim); }
.pos-item .pr{ margin-top:6px; font-family:var(--serif); font-size:15px; }
.pos-item.disabled{ opacity:.4; }
.cart-box{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px; position:sticky; top:80px;}
.cart-box h4{ font-family:var(--serif); margin:0 0 10px; font-size:15px; display:flex; justify-content:space-between;}
.cart-line{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--rule-2); font-size:13px;}
.cart-line .nm{ flex:1; }
.cart-line .qty-ctl{ display:flex; align-items:center; gap:4px; }
.cart-line .qty-ctl button{ width:22px; height:22px; border-radius:5px; border:1px solid var(--rule); background:#fff;}
.cart-line .qty-ctl input{ width:36px; text-align:center; padding:3px; border:1px solid var(--rule); border-radius:5px;}
.cart-line .amt{ width:62px; text-align:right; }
.cart-line .rm{ background:none; border:none; color:var(--rust); font-size:15px; }
.cart-empty{ color:var(--text-dim); font-size:12.5px; padding:20px 0; text-align:center; }
.cart-tot-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; }
.cart-tot-row.grand{ font-family:var(--serif); font-size:18px; border-top:1.5px solid var(--rule); margin-top:6px; padding-top:10px;}

/* ---------- Ledger view (party) ---------- */
.ledger-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.ledger-avatar{ width:46px; height:46px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:18px;}
.bal-pos{ color:var(--rust); font-weight:600; }
.bal-neg{ color:var(--accent); font-weight:600; }

/* ---------- misc ---------- */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--rule); margin-bottom:16px; }
.tab{ padding:9px 14px; border:none; background:none; font-size:13px; color:var(--text-dim); border-bottom:2px solid transparent; }
.tab.active{ color:var(--ink); border-color:var(--accent); font-weight:600; }
.chart-svg text{ font-family:var(--sans); }
.empty-state{ text-align:center; padding:60px 20px; color:var(--text-dim); }
.empty-state .big{ font-family:var(--serif); font-size:17px; color:var(--text); margin-bottom:6px; }
.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--ink); color:#fff; padding:10px 16px; border-radius:9px; font-size:13px; box-shadow:0 10px 24px rgba(0,0,0,.25); animation:in .18s ease; }
.toast.err{ background:var(--rust); }
@keyframes in{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.print-only{ display:none; }
.perm-lock{ text-align:center; padding:80px 20px; color:var(--text-dim); }


/* ---------- Phone layout ---------- */
.mob-only{ display:none; }
@media (max-width:820px){
  .mob-only{ display:inline-flex; }
  #app.show{ display:block; }
  #sidebar{
    position:fixed; left:0; right:0; bottom:0; top:auto; width:100%; height:auto; min-height:0; z-index:90;
    flex-direction:row; border-top:1px solid rgba(255,255,255,.14);
  }
  .side-brand, .side-foot{ display:none; }
  .side-nav{
    display:flex; flex-direction:row; gap:2px; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    overflow-x:auto; overflow-y:hidden; width:100%;
  }
  .side-nav .grp-label{ display:none; }

<script>
/* =========================================================
   COUNTER — offline shop / inventory manager
   All data lives in memory + localStorage (best-effort cache).
   True persistence = Export / Import JSON from Settings > Backup.
   ========================================================= */

const STORAGE_KEY = 'counter_shop_data_v1';

function uid(p){ return (p||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ const dt = new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ', ' + dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function money(n){ n = Number(n)||0; const cur = DB.settings.currency || '₹'; return cur + n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ---------------- default seed data ---------------- */
function seedData(){
  return {
    business: { name:'', address:'', phone:'', wholesaleMode:false },
    settings: { currency:'₹', invoicePrefix:'INV-', nextInvoiceNo:1, billPrefix:'PB-', nextBillNo:1, lowStockDefault:5 },
    users: [],
    currentUserId: null,
    categories: ['General','Grocery','Beverages','Snacks','Household','Stationery'],
    units: ['pcs','kg','g','l','ml','box','pack'],
    items: [],
    parties: [],
    sales: [],
    purchases: [],
    payments: [],
    stockAdjustments: []
  };
}

let DB = seedData();
let SESSION = { pickedUserId:null, pinBuffer:'' };
let CART = []; // {itemId, qty, price}
let UI = { view:'dashboard', partyFilter:'customer', reportTab:'sales', reportFrom:null, reportTo:null, selectedPartyId:null };

/* ---------------- persistence ---------------- */
let WARNED_STORAGE = false;
function saveLocal(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){
    if(!WARNED_STORAGE){
      WARNED_STORAGE = true;
      setTimeout(()=>toast('This browser can\u2019t auto-save here. Use Settings \u2192 Backup \u2192 Download backup often so you don\u2019t lose data.', true), 300);
    }
  }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.business!==undefined){ DB = Object.assign(seedData(), parsed); return true; } }
  }catch(e){ /* ignore corrupt cache */ }
  return false;
}
function persist(){ saveLocal(); }

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href = url; a.download = `counter-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup file downloaded — keep it somewhere safe.');
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !parsed.items){ throw new Error('bad file'); }
      DB = Object.assign(seedData(), parsed);
      persist();
      toast('Backup restored.');
      closeModal();
      location.reload();
    }catch(err){ toast('Could not read that file — is it a Counter backup?', true); }
  };
  reader.readAsText(file);
}

/* ---------------- toast ---------------- */
function toast(msg, isErr){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast' + (isErr?' err':'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ============================================================
   LOGIN / SETUP / SESSION
   ============================================================ */
function initLogin(){
  loadLocal();
  if(!DB.users.length){
    document.getElementById('setup-block').style.display='block';
    document.getElementById('pick-block').style.display='none';
  } else {
    renderUserPick();
  }
  document.getElementById('login-biz-name').textContent = DB.business.name || 'Counter';
  document.getElementById('login-mark').textContent = initials(DB.business.name || 'C').slice(0,1);
}

function finishSetup(){
  const biz = document.getElementById('setup-biz').value.trim();
  const name = document.getElementById('setup-name').value.trim();
  const pin = document.getElementById('setup-pin').value.trim();
  const err = document.getElementById('setup-err');
  if(!biz || !name || !/^\d{4}$/.test(pin)){ err.textContent = 'Fill every field — PIN must be exactly 4 digits.'; return; }
  DB.business.name = biz;
  DB.users.push({ id: uid('u'), name, role:'admin', pin, createdAt: nowISO() });
  persist();
  document.getElementById('login-biz-name').textContent = biz;
  document.getElementById('setup-block').style.display='none';
  document.getElementById('pick-block').style.display='block';
  renderUserPick();
  toast('Shop created. Welcome, ' + name + '.');
}

function renderUserPick(){
  const list = document.getElementById('user-pick-list');
  list.innerHTML = DB.users.map(u => `
    <button class="user-btn" onclick="APP.pickUser('${u.id}')">
      <span class="user-avatar">${esc(initials(u.name))}</span>
      <span>${esc(u.name)}</span>
      <span class="role-tag">${u.role}</span>
    </button>`).join('') + `
    <button class="user-btn" style="justify-content:center;color:var(--text-dim);" onclick="APP.newUserFromLogin()">+ Add user</button>`;
}
function newUserFromLogin(){
  document.getElementById('pick-block').style.display='none';
  document.getElementById('setup-block').style.display='block';
  document.getElementById('setup-block').innerHTML = `
    <div class="setup-form">
      <label>Name</label><input type="text" id="nu-name">
      <label>Role</label>
      <select id="nu-role"><option value="staff">Staff</option><option value="admin">Admin</option></select>
      <label>Set a 4-digit PIN</label><input type="password" id="nu-pin" maxlength="4" inputmode="numeric">
    </div>
    <div class="login-err" id="nu-err"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:6px;padding:11px;" onclick="APP.addUserFromLogin()">Add user</button>
    <div class="login-back"><button onclick="APP.backToPick()">← back</button></div>`;
}
function addUserFromLogin(){
  const name = document.getElementById('nu-name').value.trim();
  const role = document.getElementById('nu-role').value;
  const pin = document.getElementById('nu-pin').value.trim();
  const err = document.getElementById('nu-err');
  if(!name || !/^\d{4}$/.test(pin)){ err.textContent='Name + a 4-digit PIN are required.'; return; }
  DB.users.push({ id: uid('u'), name, role, pin, createdAt: nowISO() });
  persist();
  backToPick();
}
function backToPick(){
  document.getElementById('setup-block').style.display='none';
  document.getElementById('setup-block').innerHTML = document.getElementById('setup-block').innerHTML; // no-op safe
  document.getElementById('pick-block').style.display='block';
  document.getElementById('pin-block').classList.remove('show');
  renderUserPick();
}
function pickUser(id){
  SESSION.pickedUserId = id; SESSION.pinBuffer='';
  const u = DB.users.find(x=>x.id===id);
  document.getElementById('pick-block').style.display='none';
  document.getElementById('pin-block').classList.add('show');
  document.getElementById('pin-who').textContent = 'Enter PIN for ' + u.name;
  document.getElementById('pin-err').textContent='';
  renderPinDots();
  const keys = [1,2,3,4,5,6,7,8,9,'⌫',0,'✓'];
  document.getElementById('pin-keys').innerHTML = keys.map(k=>{
    if(k==='⌫') return `<button onclick="APP.pinKey('back')">⌫</button>`;
    if(k==='✓') return `<button onclick="APP.pinKey('go')">✓</button>`;
    return `<button onclick="APP.pinKey('${k}')">${k}</button>`;
  }).join('');
}
function renderPinDots(){
  const dots = document.querySelectorAll('#pin-dots span');
  dots.forEach((d,i)=> d.classList.toggle('filled', i < SESSION.pinBuffer.length));
}
function pinKey(k){
  if(k==='back'){ SESSION.pinBuffer = SESSION.pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(k==='go'){ tryLogin(); return; }
  if(SESSION.pinBuffer.length<4){ SESSION.pinBuffer += k; renderPinDots(); }
  if(SESSION.pinBuffer.length===4) tryLogin();
}
function tryLogin(){
  const u = DB.users.find(x=>x.id===SESSION.pickedUserId);
  if(u && u.pin === SESSION.pinBuffer){
    DB.currentUserId = u.id; persist();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').classList.add('show');
    boot();
  } else {
    document.getElementById('pin-err').textContent = 'Incorrect PIN, try again.';
    SESSION.pinBuffer=''; renderPinDots();
  }
}
function logout(){
  DB.currentUserId = null; persist();
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pin-block').classList.remove('show');
  document.getElementById('pick-block').style.display='block';
  renderUserPick();
}
function currentUser(){ return DB.users.find(u=>u.id===DB.currentUserId) || {name:'—',role:'staff'}; }
function isAdmin(){ return currentUser().role==='admin'; }

/* ============================================================
   NAV
   ============================================================ */
const NAV = [
  {grp:'Overview', items:[ {id:'dashboard', label:'Dashboard', ic:'◆'} ]},
  {grp:'Sell', items:[ {id:'billing', label:'New Sale', ic:'₹'}, {id:'sales', label:'Sales History', ic:'≡'} ]},
  {grp:'Stock', items:[ {id:'items', label:'Items', ic:'▣'}, {id:'purchases', label:'Purchases', ic:'↓'}, {id:'adjustments', label:'Stock Log', ic:'≈'} ]},
  {grp:'People', items:[ {id:'parties', label:'Customers & Suppliers', ic:'☺'}, {id:'payments', label:'Payments', ic:'⇄'} ]},
  {grp:'Insights', items:[ {id:'reports', label:'Reports', ic:'▤'} ]},
  {grp:'', items:[ {id:'settings', label:'Settings', ic:'⚙', adminOnly:true} ]},
];
function renderSideNav(){
  const el = document.getElementById('side-nav');
  el.innerHTML = NAV.map(g => {
    if(!g.items.some(it => !it.adminOnly || isAdmin())) return '';
    return (g.grp?`<div class="grp-label">${g.grp}</div>`:'') + g.items.map(it=>{
      if(it.adminOnly && !isAdmin()) return '';
      return `<button class="side-link ${UI.view===it.id?'active':''}" onclick="APP.go('${it.id}')"><span class="ic">${it.ic}</span>${it.label}</button>`;
    }).join('');
  }).join('');
  document.getElementById('side-biz-name').textContent = DB.business.name || 'Counter';
  document.getElementById('side-user-name').textContent = currentUser().name + ' · ' + currentUser().role;
}
function go(view){ UI.view = view; render(); }

function boot(){
  renderSideNav();
  render();
}

/* ============================================================
   MAIN RENDER ROUTER
   ============================================================ */
function render(){
  renderSideNav();
  const titles = {
    dashboard:['Dashboard', 'Today at a glance'],
    billing:['New Sale', 'Scan or search items to bill a customer'],
    sales:['Sales History', 'Every invoice you have raised'],
    items:['Items', 'Your inventory catalogue'],
    purchases:['Purchases', 'Stock coming into the shop'],
    adjustments:['Stock Log', 'Manual stock corrections & history'],
    parties:['Customers & Suppliers', 'People you buy from and sell to'],
    payments:['Payments', 'Money received and paid out'],
    reports:['Reports', 'How the business is doing'],
    settings:['Settings', 'Shop, users, and backups'],
  };
  const [t,s] = titles[UI.view] || ['',''];
  document.getElementById('page-title').textContent = t;
  document.getElementById('page-sub').textContent = s;
  document.getElementById('page-actions').innerHTML = '';
  const c = document.getElementById('content');

  if(UI.view==='settings' && !isAdmin()){
    c.innerHTML = `<div class="perm-lock">Only an admin can open Settings.</div>`; return;
  }

  const fns = {
    dashboard: renderDashboard, billing: renderBilling, sales: renderSales,
    items: renderItems, purchases: renderPurchases, adjustments: renderAdjustments,
    parties: renderParties, payments: renderPayments, reports: renderReports, settings: renderSettings
  };
  (fns[UI.view] || renderDashboard)();
}

/* ============================================================
   HELPERS: stock / money calcs
   ============================================================ */
function getItem(id){ return DB.items.find(i=>i.id===id); }
function getParty(id){ return DB.parties.find(p=>p.id===id); }
function tracks(it){ return it && it.trackStock!==false; }
function outOfStock(it){ return tracks(it) && it.stock<=0; }
function isLow(it){ return tracks(it) && it.stock<=it.lowStockAlert; }
function availableFor(it){ return tracks(it) ? it.stock : Infinity; }
function stockText(it){ return tracks(it) ? (it.stock+' '+it.unit+' in stock') : 'Stock not tracked'; }
function stockStatus(it){
  if(!tracks(it)) return {label:'Not tracked', cls:''};
  if(it.stock<=0) return {label:'Out of stock', cls:'badge-out'};
  if(it.stock<=it.lowStockAlert) return {label:'Low stock', cls:'badge-warn'};
  return {label:'In stock', cls:'badge-ok'};
}
function partyBalance(partyId){
  // + means party owes shop (receivable); - means shop owes party (payable)
  let bal = 0;
  const p = getParty(partyId); if(!p) return 0;
  bal += Number(p.openingBalance)||0;
  DB.sales.forEach(s=>{ if(s.partyId===partyId) bal += (s.due||0); });
  DB.purchases.forEach(pu=>{ if(pu.partyId===partyId) bal -= (pu.due||0); });
  DB.payments.forEach(pay=>{
    if(pay.partyId===partyId){ if(pay.type==='in') bal -= pay.amount; else bal += pay.amount; }
  });
  return Math.round(bal*100)/100;
}
function partyTransactions(partyId){
  const rows = [];
  DB.sales.filter(s=>s.partyId===partyId).forEach(s=> rows.push({date:s.date, type:'Sale', ref:s.invoiceNo, amt:s.total, note:`${s.items.length} item(s)`}));
  DB.purchases.filter(p=>p.partyId===partyId).forEach(p=> rows.push({date:p.date, type:'Purchase', ref:p.billNo, amt:-p.total, note:`${p.items.length} item(s)`}));
  DB.payments.filter(p=>p.partyId===partyId).forEach(p=> rows.push({date:p.date, type: p.type==='in'?'Payment received':'Payment made', ref:'—', amt: p.type==='in' ? -p.amount : p.amount, note:p.note||''}));
  rows.sort((a,b)=> new Date(a.date) - new Date(b.date));
  return rows;
}
function totalStockValue(){
  return DB.items.filter(tracks).reduce((s,it)=> s + it.stock * (Number(it.purchasePrice)||0), 0);
}
function todaysSales(){
  const t = todayISO();
  return DB.sales.filter(s=>s.date===t).reduce((s,x)=>s+x.total,0);
}
function inRange(dateStr, from, to){
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

/* ============================================================
   SVG bar chart (no external libs)
   ============================================================ */
function barChart(labels, values, opts){
  opts = opts || {};
  const w = opts.w||620, h = opts.h||180, padL=40, padB=26, padT=10;
  const max = Math.max(1, ...values);
  const bw = (w-padL-10) / values.length;
  let bars = '', labs = '';
  values.forEach((v,i)=>{
    const bh = (h-padT-padB) * (v/max);
    const x = padL + i*bw + bw*0.15;
    const y = h-padB-bh;
    bars += `<rect x="${x}" y="${y}" width="${bw*0.7}" height="${bh}" rx="3" fill="var(--accent)"></rect>`;
    labs += `<text x="${x+bw*0.35}" y="${h-8}" font-size="9.5" fill="#6b7280" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  const gridY = [0,0.5,1].map(f=>{
    const y = padT + (h-padT-padB)*(1-f);
    return `<line x1="${padL}" y1="${y}" x2="${w-10}" y2="${y}" stroke="#EAE5D8" stroke-width="1"></line>
            <text x="${padL-6}" y="${y+3}" font-size="9" fill="#9aa1ad" text-anchor="end">${Math.round(max*f)}</text>`;
  }).join('');
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${gridY}${bars}${labs}</svg>`;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const low = DB.items.filter(isLow);
  const receivable = DB.parties.filter(p=>p.type==='customer').reduce((s,p)=>s+Math.max(0,partyBalance(p.id)),0);
  const payable = DB.parties.filter(p=>p.type==='supplier').reduce((s,p)=>s+Math.max(0,-partyBalance(p.id)),0);

  document.getElementById('page-actions').innerHTML = `
    <button class="btn btn-accent" onclick="APP.go('billing')">+ New Sale</button>
    <button class="btn" onclick="APP.openItemModal()">+ Add Item</button>`;

  // last 7 days sales
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toISOString().slice(0,10); });
  const dayVals = days.map(d=> DB.sales.filter(s=>s.date===d).reduce((s,x)=>s+x.total,0));
  const dayLabs = days.map(d=> new Date(d).toLocaleDateString('en-IN',{weekday:'short'}));

  const recent = [...DB.sales].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)).slice(0,6);

  document.getElementById('content').innerHTML = `
    <div class="grid g-4">
      <div class="card stat"><div class="lbl">Today's sales</div><div class="val">${money(todaysSales())}</div><div class="delta">${DB.sales.filter(s=>s.date===todayISO()).length} invoice(s) today</div></div>
      <div class="card stat ${low.length?'warn':''}"><div class="lbl">Low / out of stock</div><div class="val">${low.length}</div><div class="delta">${DB.items.length} items total</div></div>
      <div class="card stat"><div class="lbl">To collect (receivable)</div><div class="val">${money(receivable)}</div><div class="delta">from customers</div></div>
      <div class="card stat"><div class="lbl">To pay (payable)</div><div class="val">${money(payable)}</div><div class="delta">to suppliers</div></div>
    </div>

    <div class="grid g-2" style="margin-top:16px; align-items:start;">
      <div class="card">
        <div style="font-family:var(--serif); font-size:15px; margin-bottom:10px;">Sales, last 7 days</div>
        ${barChart(dayLabs, dayVals)}
      </div>
      <div class="card">
        <div style="font-family:var(--serif); font-size:15px; margin-bottom:10px; display:flex; justify-content:space-between;">
          <span>Low stock</span><button class="btn btn-sm" onclick="APP.go('items')">View all</button>
        </div>

function saveItem(id){
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-cat').value;
  const unit = document.getElementById('f-unit').value;
  const sku = document.getElementById('f-sku').value.trim();
  const barcode = document.getElementById('f-barcode').value.trim();
  const pp = parseFloat(document.getElementById('f-pp').value)||0;
  const sp = parseFloat(document.getElementById('f-sp').value)||0;
  const low = parseInt(document.getElementById('f-low').value)||0;
  const track = document.getElementById('f-track').checked;
  const err = document.getElementById('f-err');
  if(!name || sp<=0){ err.textContent='Item name and a sale price are required.'; return; }
  let wp=null, wq=null, newItem=null;
  if(DB.business.wholesaleMode){
    wp = parseFloat(document.getElementById('f-wp').value)||null;
    wq = parseInt(document.getElementById('f-wq').value)||null;
  }
  if(id){
    const it = getItem(id);
    Object.assign(it, {name, category, unit, sku, barcode, purchasePrice:pp, salePrice:sp, lowStockAlert:low, wholesalePrice:wp, wholesaleMinQty:wq, trackStock:track});
  } else {
    const stock = parseInt(document.getElementById('f-stock').value)||0;
    newItem = { id: uid('it'), name, category, unit, sku, barcode, purchasePrice:pp, salePrice:sp, stock, lowStockAlert:low, wholesalePrice:wp, wholesaleMinQty:wq, trackStock:track, createdAt: nowISO() };
    DB.items.push(newItem);
  }
  persist(); closeModal();
  if(newItem && UI.itemModalOpts && UI.itemModalOpts.fromBilling){
    UI.view='billing'; render();
    const r=addToCart(newItem.id,{quiet:true});
    toast(r.ok ? 'Saved and added to the bill: '+newItem.name : 'Item saved. Add stock (or turn off \u201CTrack stock\u201D) to sell it.', !r.ok);
  } else { render(); toast('Item saved.'); }
}
function deleteItem(id){
  if(!confirm('Delete this item? This cannot be undone.')) return;
  DB.items = DB.items.filter(i=>i.id!==id);
  persist(); closeModal(); render(); toast('Item deleted.');
}

    </div>

function saveStockAdjust(id){
  const it = getItem(id);
  const type = document.getElementById('sa-type').value;
  const qty = parseInt(document.getElementById('sa-qty').value)||0;
  const note = document.getElementById('sa-note').value.trim();
  if(qty<=0){ document.getElementById('sa-err').textContent='Enter a valid quantity.'; return; }
  const change = type==='add' ? qty : -qty;
  if(type==='remove' && qty>it.stock){ document.getElementById('sa-err').textContent='Cannot remove more than current stock.'; return; }
  it.stock += change;
  DB.stockAdjustments.push({ id: uid('adj'), date: todayISO(), itemId:id, qtyChange:change, reason:note||(type==='add'?'Stock added':'Stock removed'), createdBy: currentUser().name, createdAt: nowISO() });
  persist(); closeModal(); render(); toast('Stock updated.');
}

function setPosSearch(v){ UI.posSearch=v; const grid=document.getElementById('pos-grid'); if(grid){ /* light rerender only grid */ } renderBillingGridOnly(); }
function renderBillingGridOnly(){
  const q = (UI.posSearch||'').toLowerCase();
  const filtered = DB.items.filter(i => !q || i.name.toLowerCase().includes(q) || (i.barcode||'').includes(q) || (i.sku||'').toLowerCase().includes(q));

    </button>`;

}
function posScanEnter(val){
  val = String(val||'').trim(); if(!val) return;
  const it = findItemByCode(val) || DB.items.find(i=>i.name.toLowerCase()===val.toLowerCase());
  if(it){
    const r = addToCart(it.id); UI.posSearch=''; renderBillingGridOnly();
    if(r.ok){ beep(); toast('Added: '+it.name); } else beepBad();
  }
  else if(/^\d{6,}$/.test(val)){
    UI.posSearch=''; renderBillingGridOnly(); beepBad();
    if(confirm('No item has barcode '+val+'.\nAdd it as a new item now?')) openItemModal(null,{barcode:val, fromBilling:true});
  }
  else { UI.posSearch = val; renderBillingGridOnly(); toast('No exact match \u2014 showing search results.'); }
}
function addToCart(itemId, opts){
  opts = opts || {};
  const it = getItem(itemId);
  const fail = msg => { if(!opts.quiet) toast(msg, true); return {ok:false, msg}; };
  if(!it) return fail('Item not found.');
  if(outOfStock(it)) return fail(it.name+' is out of stock.');
  let line = CART.find(c=>c.itemId===itemId);
  if(line){
    if(line.qty+1 > availableFor(it)) return fail('Only '+it.stock+' '+it.unit+' of '+it.name+' in stock.');
    line.qty += 1;
  } else { line = { itemId, qty:1, price:it.salePrice }; CART.push(line); }
  line.price = (DB.business.wholesaleMode && it.wholesalePrice && it.wholesaleMinQty && line.qty>=it.wholesaleMinQty) ? it.wholesalePrice : it.salePrice;
  refreshCartTotals();
  return {ok:true, qty:line.qty};
}
function refreshCartTotals(){
  const box = document.querySelector('.cart-box');
  if(!box) return;
  document.getElementById('cart-lines').innerHTML = renderCartLines();
  const totWrap = box.querySelector('.cart-totals');
  if(totWrap) totWrap.outerHTML = renderCartTotals();
  const h4 = box.querySelector('h4 span');
  if(h4) h4.textContent = CART.length + ' item(s)';
}
function renderCartLines(){
  if(!CART.length) return `<div class="cart-empty">Cart is empty — tap an item to add it.</div>`;
  return CART.map((c,idx)=>{
    const it = getItem(c.itemId);
    return `<div class="cart-line">
      <div class="nm">${esc(it?it.name:'—')}<div style="font-size:11px;color:var(--text-dim);">${money(c.price)} each</div></div>
      <div class="qty-ctl">
        <button onclick="APP.cartQty(${idx},-1)">−</button>
        <input value="${c.qty}" onchange="APP.cartQtySet(${idx}, this.value)">
        <button onclick="APP.cartQty(${idx},1)">+</button>
      </div>
      <div class="amt num">${money(c.qty*c.price)}</div>
      <button class="rm" onclick="APP.cartRemove(${idx})">&times;</button>
    </div>`;
  }).join('');
}
function cartQty(idx, delta){
  const c = CART[idx]; const it = getItem(c.itemId);
  const nq = c.qty+delta;
  if(nq<=0){ CART.splice(idx,1); } else if(nq>availableFor(it)){ toast('Not enough stock.', true); return; } else { c.qty=nq; }
  refreshCartTotals();
}
function cartQtySet(idx, val){
  const c = CART[idx]; const it = getItem(c.itemId);
  let nq = parseInt(val)||0;
  if(nq<=0){ CART.splice(idx,1); }
  else if(nq>availableFor(it)){ toast('Not enough stock — set to max available.', true); c.qty=it.stock; }
  else c.qty=nq;
  refreshCartTotals();
}
function cartRemove(idx){ CART.splice(idx,1); refreshCartTotals(); }
function cartSubtotal(){ return CART.reduce((s,c)=>s+c.qty*c.price,0); }
function renderCartTotals(){
  const sub = cartSubtotal();
  const disc = UI.cartDiscount||0;
  const total = Math.max(0, sub-disc);
  const paid = UI.cartPaid==null ? total : UI.cartPaid;
  const due = Math.max(0, total-paid);
  return `<div class="cart-totals">
    <div class="cart-tot-row"><span>Subtotal</span><span class="num">${money(sub)}</span></div>
    <div class="field" style="margin:8px 0 4px;"><label>Discount (₹)</label><input type="number" min="0" value="${disc}" onchange="APP.setDiscount(this.value)"></div>
    <div class="cart-tot-row grand"><span>Total</span><span class="num">${money(total)}</span></div>
    <div class="field" style="margin:10px 0 4px;"><label>Payment mode</label>
      <select id="pay-mode">
        <option ${UI.cartMode==='Cash'||!UI.cartMode?'selected':''}>Cash</option>
        <option ${UI.cartMode==='UPI'?'selected':''}>UPI</option>
        <option ${UI.cartMode==='Card'?'selected':''}>Card</option>
        <option ${UI.cartMode==='Credit'?'selected':''}>Credit (pay later)</option>
      </select>
    </div>
    <div class="field"><label>Amount received (₹)</label><input type="number" min="0" id="pay-amt" value="${paid.toFixed(2)}" onchange="APP.setPaid(this.value)"></div>
    ${due>0?`<div class="cart-tot-row" style="color:var(--rust);"><span>Balance due</span><span class="num">${money(due)}</span></div>`:''}
    <button class="btn btn-accent" style="width:100%;margin-top:10px;padding:11px;" ${!CART.length?'disabled':''} onclick="APP.completeSale()">Complete sale</button>
  </div>`;
}
function setDiscount(v){ UI.cartDiscount = parseFloat(v)||0; UI.cartPaid=null; refreshCartTotals(); }
function setPaid(v){ UI.cartPaid = parseFloat(v)||0; refreshCartTotals(); }

function completeSale(){
  if(!CART.length) return;
  const sub = cartSubtotal();
  const disc = UI.cartDiscount||0;
  const total = Math.max(0, sub-disc);
  const mode = document.getElementById('pay-mode') ? document.getElementById('pay-mode').value : 'Cash';
  let paid = UI.cartPaid==null ? total : UI.cartPaid;
  if(mode==='Credit' && UI.cartPaid==null) paid = 0;
  paid = Math.min(paid, total);
  const due = Math.max(0, total-paid);

  const invNo = DB.settings.invoicePrefix + String(DB.settings.nextInvoiceNo).padStart(4,'0');
  const sale = {
    id: uid('sale'), invoiceNo: invNo, date: todayISO(), createdAt: nowISO(),
    partyId: UI.cartPartyId || null,
    items: CART.map(c=>({ itemId:c.itemId, name:getItem(c.itemId).name, qty:c.qty, price:c.price, total:c.qty*c.price })),
    subtotal: sub, discount: disc, total, paid, due, mode, createdBy: currentUser().name
  };
  CART.forEach(c=>{ const it=getItem(c.itemId); if(tracks(it)) it.stock -= c.qty; });
  DB.sales.push(sale);
  DB.settings.nextInvoiceNo++;
  if(paid>0){
    DB.payments.push({ id:uid('pay'), date: todayISO(), partyId: sale.partyId, type:'in', amount:paid, mode, note:'Sale '+invNo, linkedSaleId: sale.id, createdBy: currentUser().name, createdAt: nowISO() });
  }
  persist();
  CART = []; UI.cartDiscount=0; UI.cartPaid=null; UI.cartPartyId=null;
  closeModal();
  openInvoicePreview(sale.id, true);
  render();
}

function saveCollectDue(id){
  const s = DB.sales.find(x=>x.id===id);

  if(amt<=0 || amt>s.due){ document.getElementById('cd-err').textContent='Enter an amount up to '+money(s.due)+'.'; return; }

  DB.payments.push({ id:uid('pay'), date: todayISO(), partyId: s.partyId, type:'in', amount:amt, mode, note:'Due collected for '+s.invoiceNo, linkedSaleId: s.id, createdBy: currentUser().name, createdAt: nowISO() });

function pcartAdd(){
  const itemId = document.getElementById('pu-item-pick').value;
  const qty = parseInt(document.getElementById('pu-qty').value)||0;
  const price = parseFloat(document.getElementById('pu-price').value)||0;
  if(!itemId || qty<=0){ return; }
  PCART.push({itemId, qty, price});
  document.getElementById('pu-lines').innerHTML = renderPCartLines();
  document.getElementById('pu-total').textContent = money(PCART.reduce((s,c)=>s+c.qty*c.price,0));
}
function pcartRemove(idx){ PCART.splice(idx,1); document.getElementById('pu-lines').innerHTML = renderPCartLines(); document.getElementById('pu-total').textContent = money(PCART.reduce((s,c)=>s+c.qty*c.price,0)); }
function renderPCartLines(){
  if(!PCART.length) return `<div class="cart-empty">No items added to this bill yet.</div>`;
  return `<div class="tbl-wrap" style="margin:10px 0;"><table class="ledger"><tbody>
    ${PCART.map((c,idx)=>`<tr><td>${esc(getItem(c.itemId).name)}</td><td class="num" style="text-align:right;">${c.qty} × ${money(c.price)}</td><td class="num" style="text-align:right;">${money(c.qty*c.price)}</td><td style="text-align:right;"><button class="rm" onclick="APP.pcartRemove(${idx})">&times;</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function savePurchase(){
  if(!PCART.length){ document.getElementById('pu-err').textContent='Add at least one item.'; return; }
  const partyId = document.getElementById('pu-party').value || null;
  const date = document.getElementById('pu-date').value || todayISO();
  const paidInput = parseFloat(document.getElementById('pu-paid').value)||0;
  const total = PCART.reduce((s,c)=>s+c.qty*c.price,0);
  const paid = Math.min(paidInput, total);
  const due = total-paid;
  const billNo = DB.settings.billPrefix + String(DB.settings.nextBillNo).padStart(4,'0');
  const purchase = { id: uid('pur'), billNo, date, createdAt: nowISO(), partyId,
    items: PCART.map(c=>({itemId:c.itemId, name:getItem(c.itemId).name, qty:c.qty, price:c.price, total:c.qty*c.price})),
    total, paid, due, createdBy: currentUser().name };
  PCART.forEach(c=>{ const it=getItem(c.itemId); it.stock += c.qty; it.purchasePrice = c.price; });
  DB.purchases.push(purchase); DB.settings.nextBillNo++;
  if(paid>0) DB.payments.push({ id:uid('pay'), date, partyId, type:'out', amount:paid, mode:'Cash', note:'Purchase '+billNo, linkedPurchaseId:purchase.id, createdBy: currentUser().name, createdAt: nowISO() });
  persist(); closeModal(); render(); toast('Purchase recorded — stock updated.');
}

function exportCSV(tab){
  let rows = [], headers = [];
  if(tab==='sales'){ headers=['Invoice','Date','Customer','Total','Paid','Due']; rows = DB.sales.filter(s=>inRange(s.date,UI.reportFrom||'',UI.reportTo||'')).map(s=>[s.invoiceNo,s.date,s.partyId?(getParty(s.partyId)||{}).name:'Walk-in',s.total,s.paid,s.due]); }
  else if(tab==='purchases'){ headers=['Bill','Date','Supplier','Total','Paid','Due']; rows = DB.purchases.filter(p=>inRange(p.date,UI.reportFrom||'',UI.reportTo||'')).map(p=>[p.billNo,p.date,p.partyId?(getParty(p.partyId)||{}).name:'—',p.total,p.paid,p.due]); }
  else if(tab==='stock'){ headers=['Item','Stock','Unit','Purchase Price','Sale Price','Value']; rows = DB.items.map(i=>[i.name,i.stock,i.unit,i.purchasePrice,i.salePrice,i.stock*i.purchasePrice]); }
  else { headers=['Party','Outstanding']; rows = DB.parties.map(p=>[p.name, partyBalance(p.id)]); }
  const csv = [headers.join(','), ...rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = tab+'-report.csv'; a.click();
}
