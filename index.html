/* ============================================================
   BC — tiny offline 1D barcode reader
   Formats: EAN-13, UPC-A (as EAN-13), EAN-8, Code 128.
   Works on plain grayscale pixel data, so it needs no browser
   barcode API, no camera permission and no internet.
   ============================================================ */
const BC = (function(){
  const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  function bitsToRuns(bits){
    const out=[]; let c=bits[0], n=0;
    for(let i=0;i<bits.length;i++){ if(bits[i]===c) n++; else { out.push(n); c=bits[i]; n=1; } }
    out.push(n); return out;
  }
  const LC = L.map((b,d)=>({pat:bitsToRuns(b), d, t:'L'}));
  const GC = G.map((b,d)=>({pat:bitsToRuns(b), d, t:'G'}));
  const RC = R.map((b,d)=>({pat:bitsToRuns(b), d, t:'R'}));
  const LG = LC.concat(GC);
  let MAXERR = 1.2;      // worst allowed error for a single digit (in modules)
  let MAXAVG = 0.75;     // worst allowed average error over the whole code
  let ERRSUM = 0;        // scratch: running error total for the code being decoded

  function matchGroup(r, p, cands){
    const tot = r[p]+r[p+1]+r[p+2]+r[p+3];
    if(tot<=0) return null;
    const u = tot/7; let best=null, bestErr=1e9;
    for(let c=0;c<cands.length;c++){
      const pt = cands[c].pat; let e=0;
      for(let k=0;k<4;k++) e += Math.abs(r[p+k]/u - pt[k]);
      if(e<bestErr){ bestErr=e; best=cands[c]; }
    }
    if(bestErr>MAXERR) return null;
    ERRSUM += bestErr;
    return best;
  }
  function guardOk(r,i,n,m){
    for(let k=0;k<n;k++){ const x=r[i+k]/m; if(x<0.4||x>2.0) return false; }
    return true;
  }
  function ean13Check(d){
    let s=0; for(let k=0;k<12;k++) s += d[k]*(k%2===0?1:3);
    return ((10 - s%10)%10) === d[12];
  }
  function ean8Check(d){
    let s=0; for(let k=0;k<7;k++) s += d[k]*(k%2===0?3:1);
    return ((10 - s%10)%10) === d[7];
  }
  function decodeEAN13(r,i){
    if(i+59>r.length) return null;
    const m=(r[i]+r[i+1]+r[i+2])/3;
    if(m<1||!guardOk(r,i,3,m)||!guardOk(r,i+27,5,m)||!guardOk(r,i+56,3,m)) return null;
    ERRSUM=0;
    const digits=[]; let parity='';
    for(let k=0;k<6;k++){ const c=matchGroup(r,i+3+k*4,LG); if(!c) return null; digits.push(c.d); parity+=c.t; }
    const first=PARITY.indexOf(parity); if(first<0) return null;
    for(let k=0;k<6;k++){ const c=matchGroup(r,i+32+k*4,RC); if(!c) return null; digits.push(c.d); }
    const all=[first].concat(digits);
    if(!ean13Check(all)) return null;
    if(ERRSUM/12 > MAXAVG) return null;
    return { text: all.join(''), format:'ean_13', err: ERRSUM/12 };
  }
  function decodeEAN8(r,i){
    if(i+43>r.length) return null;
    const m=(r[i]+r[i+1]+r[i+2])/3;
    if(m<1||!guardOk(r,i,3,m)||!guardOk(r,i+19,5,m)||!guardOk(r,i+40,3,m)) return null;
    ERRSUM=0;
    const digits=[];
    for(let k=0;k<4;k++){ const c=matchGroup(r,i+3+k*4,LC); if(!c) return null; digits.push(c.d); }
    for(let k=0;k<4;k++){ const c=matchGroup(r,i+24+k*4,RC); if(!c) return null; digits.push(c.d); }
    if(!ean8Check(digits)) return null;
    if(ERRSUM/8 > MAXAVG*0.8) return null;   // EAN-8 has a short checksum, so be stricter
    return { text: digits.join(''), format:'ean_8', err: ERRSUM/8 };
  }

  /* ---------------- Code 128 ---------------- */
  const C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232'];
  const C128P = C128.map(s=>s.split('').map(Number));
  const STOP = [2,3,3,1,1,1,2];

  function match6(r,p){
    const tot=r[p]+r[p+1]+r[p+2]+r[p+3]+r[p+4]+r[p+5];
    if(tot<=0) return null;
    const u=tot/11; let best=-1, bestErr=1e9;
    for(let v=0; v<C128P.length; v++){
      const pt=C128P[v]; let e=0;
      for(let k=0;k<6;k++){ e += Math.abs(r[p+k]/u - pt[k]); if(e>=bestErr) break; }
      if(e<bestErr){ bestErr=e; best=v; }
    }
    return { v:best, err:bestErr };
  }
  function isStop(r,p){
    if(p+7>r.length) return false;
    let tot=0; for(let k=0;k<7;k++) tot+=r[p+k];
    const u=tot/13; let e=0;
    for(let k=0;k<7;k++) e += Math.abs(r[p+k]/u - STOP[k]);
    return e<=2.0;
  }
  function decode128(r,i){
    if(i+6+6+7>r.length) return null;
    const s=match6(r,i);
    if(!s || s.v<103 || s.v>105 || s.err>1.5) return null;
    const values=[s.v]; let p=i+6; let esum=s.err;
    while(values.length<80){
      if(isStop(r,p)) break;
      if(p+6>r.length) return null;
      const g=match6(r,p);
      if(!g || g.err>1.6 || g.v>102) return null;
      values.push(g.v); p+=6; esum+=g.err;
    }
    if(values.length<4) return null; // start + >=2 data + check
    const check=values[values.length-1];
    let sum=values[0];
    for(let k=1;k<values.length-1;k++) sum += k*values[k];
    if(sum%103 !== check) return null;
    let set = values[0]===103?'A':values[0]===104?'B':'C';
    let out='', shift=false;
    for(let k=1;k<values.length-1;k++){
      const v=values[k];
      let cs = set;
      if(shift){ cs = (set==='A')?'B':'A'; shift=false; }
      if(v===99){ set='C'; continue; }
      if(v===100){ set='B'; continue; }
      if(v===101){ set='A'; continue; }
      if(v===98){ shift=true; continue; }
      if(v>=96 && v<=102 && cs!=='C') continue; // FNC / unsupported specials
      if(cs==='C'){ if(v<=99) out += (v<10?'0':'')+v; }
      else if(cs==='B'){ if(v<=95) out += String.fromCharCode(32+v); }
      else { if(v<=63) out += String.fromCharCode(32+v); }
    }
    if(out.length<3) return null;
    if(esum/values.length > 0.9) return null;
    return { text: out, format:'code_128', err: esum/values.length };
  }

  /* ---------------- line handling ---------------- */
  function smooth(line){
    const n=line.length, out=new Float32Array(n);
    for(let i=0;i<n;i++){
      const a=line[i>0?i-1:i], b=line[i], c=line[i<n-1?i+1:i];
      out[i]=(a+2*b+c)/4;
    }
    return out;
  }
  function binarize(line, win){
    const n=line.length, bits=new Uint8Array(n);
    const ps=new Float64Array(n+1);
    for(let k=0;k<n;k++) ps[k+1]=ps[k]+line[k];
    const half=win>>1;
    for(let k=0;k<n;k++){
      const a=k-half<0?0:k-half, b=k+half+1>n?n:k+half+1;
      const mean=(ps[b]-ps[a])/(b-a);
      bits[k]= line[k] < mean-6 ? 1 : 0;
    }
    return bits;
  }
  function decodeRuns(runs, firstDark){
    const start = firstDark?0:1;
    for(let i=start;i<runs.length-20;i+=2){
      // a quiet zone (wide space) should precede the barcode, if there is anything before it
      if(i>0){
        const m=(runs[i]+runs[i+1]+runs[i+2])/3;
        if(runs[i-1] < m*2) continue;
      }
      let res = decodeEAN13(runs,i) || decodeEAN8(runs,i) || decode128(runs,i);
      if(res) return res;
    }
    return null;
  }
  /* Turn a brightness line into bar/space widths with sub-pixel edges.
     The bar/space threshold is the midpoint between the local darkest and
     lightest values, so it adapts to shadows and uneven lighting. */
  function slidingExtremes(line, half){
    const n=line.length, mn=new Float32Array(n), mx=new Float32Array(n);
    const dqMin=new Int32Array(n), dqMax=new Int32Array(n);
    let hMin=0,tMin=0,hMax=0,tMax=0, nxt=0;
    for(let k=0;k<n;k++){
      const hi=Math.min(n-1,k+half);
      while(nxt<=hi){
        while(tMin>hMin && line[dqMin[tMin-1]]>=line[nxt]) tMin--;
        dqMin[tMin++]=nxt;
        while(tMax>hMax && line[dqMax[tMax-1]]<=line[nxt]) tMax--;
        dqMax[tMax++]=nxt;
        nxt++;
      }
      const lo=k-half;
      while(dqMin[hMin]<lo) hMin++;
      while(dqMax[hMax]<lo) hMax++;
      mn[k]=line[dqMin[hMin]]; mx[k]=line[dqMax[hMax]];
    }
    return {mn,mx};
  }
  function lineToRuns(line, win){
    const n=line.length, half=win>>1;
    const ex=slidingExtremes(line, half);
    const d=new Float32Array(n), hy=new Float32Array(n);
    for(let k=0;k<n;k++){
      const c=ex.mx[k]-ex.mn[k];
      if(c<28){ d[k]=0; hy[k]=1e9; }            // flat area: no edges here
      else { d[k]=line[k]-(ex.mx[k]+ex.mn[k])/2; hy[k]=c*0.16; }
    }
    const pos=[]; let firstDark=null, state=d[0]<0?1:0, lastZero=0;
    for(let k=0;k<n-1;k++){
      if((d[k]>=0)!==(d[k+1]>=0)) lastZero = k + d[k]/(d[k]-d[k+1]);
      if(state===0 && d[k+1]<-hy[k+1]){ state=1; pos.push(lastZero); if(firstDark===null) firstDark=true; }
      else if(state===1 && d[k+1]>hy[k+1]){ state=0; pos.push(lastZero); if(firstDark===null) firstDark=false; }
    }
    const runs=[];
    for(let j=0;j+1<pos.length;j++) runs.push(pos[j+1]-pos[j]);
    return { runs, firstDark: firstDark===true };
  }
  function decodeLine(line){
    if(line.length<60) return null;
    const sm=smooth(line);
    const wins=[61,181];
    for(let w=0; w<wins.length; w++){
      const lr=lineToRuns(sm, wins[w]);
      const runs=lr.runs;
      if(runs.length<25) continue;
      let res = decodeRuns(runs, lr.firstDark);
      if(res) return res;
      const rev = runs.slice().reverse();
      const lastDark = (runs.length%2===1) ? lr.firstDark : !lr.firstDark;
      res = decodeRuns(rev, lastDark);
      if(res) return res;
    }
    return null;
  }

  /* Sweep lines of several angles across a grayscale image. */
  function decodeGray(gray, w, h, opts){
    opts = opts || {};
    const angles = opts.angles || [0,90,12,-12,78,102,25,-25,65,115,40,-40];
    const density = opts.density || 14;      // lines per sweep
    const cx=w/2, cy=h/2, diag=Math.ceil(Math.hypot(w,h));
    for(let ai=0; ai<angles.length; ai++){
      const th=angles[ai]*Math.PI/180, cs=Math.cos(th), sn=Math.sin(th);
      const extent=(Math.abs(w*sn)+Math.abs(h*cs))/2;
      const step=Math.max(3, (extent*2)/density);
      const offs=[0];
      for(let t=step; t<extent; t+=step){ offs.push(t); offs.push(-t); }
      for(let oi=0; oi<offs.length; oi++){
        const t=offs[oi];
        const line=[];
        for(let s=-diag/2; s<=diag/2; s++){
          const x=cx + s*cs - t*sn, y=cy + s*sn + t*cs;
          if(x<1||y<1||x>=w-2||y>=h-2) continue;
          // average three neighbouring parallel samples to cut noise
          const x0=Math.round(x), y0=Math.round(y);
          const nx=Math.round(-sn), ny=Math.round(cs);
          const v=(gray[y0*w+x0] + gray[Math.max(0,y0-ny)*w+Math.max(0,x0-nx)] + gray[Math.min(h-1,y0+ny)*w+Math.min(w-1,x0+nx)])/3;
          line.push(v);
        }
        if(line.length<80) continue;
        const res=decodeLine(line);
        if(res) return res;
      }
    }
    return null;
  }

  function tune(a,b){ MAXERR=a; MAXAVG=b; }
  return { decodeLine, decodeGray, tune };
})();

/* ============================================================
   LIVE BARCODE SCANNER — Zobaze-style
   Tap SCAN -> the camera opens full screen -> point at a pack ->
   the item drops into the bill with a beep, and the camera stays
   open so you can scan the next one. Bluetooth / USB scanners work
   too (see "hardware scanner" below). Barcodes are read by the
   built-in reader (BC) and, where the browser has one, its native
   BarcodeDetector as well. Nothing needs internet.
   ============================================================ */
const SC = { stream:null, timer:null, active:false, paused:false, mode:'bill', cb:null,
             native:null, track:null, torch:false, cand:null, hold:null, unknown:null, lastItemId:null };

function liveCameraPossible(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function toGray(imgData){
  const d=imgData.data, n=d.length>>2, g=new Uint8Array(n);
  for(let i=0,j=0;i<n;i++,j+=4) g[i]=(d[j]*77 + d[j+1]*150 + d[j+2]*29)>>8;
  return g;
}
let _ac=null;
function tone(freq, ms, vol){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    _ac = _ac || new C();
    const o=_ac.createOscillator(), g=_ac.createGain();
    o.frequency.value=freq; g.gain.value=vol||0.12; o.connect(g); g.connect(_ac.destination); o.start();
    setTimeout(()=>{ try{o.stop();}catch(e){} }, ms);
  }catch(e){}
}
function beep(){ tone(1000, 90); }
function beepBad(){ tone(240, 200, 0.14); }
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

function sameBarcode(a,b){
  if(!a || !b) return false;
  a=String(a).trim(); b=String(b).trim();
  if(a===b) return true;
  const na=a.replace(/^0+/,''), nb=b.replace(/^0+/,'');
  return na.length>=6 && na===nb;     // 12-digit UPC-A and its 13-digit EAN form are the same product
}
function findItemByCode(code){ return DB.items.find(i=>sameBarcode(i.barcode, code)); }

/* ---------- open / close ---------- */
function scanForBilling(){ openScanner('bill'); }
function scanForItems(){ openScanner('search', itemsScanResult); }
function scanBarcodeField(itemId){
  openScanner('field', function(code){
    const el=document.getElementById('f-barcode'); if(el) el.value=code;
    const dup=DB.items.find(i=>sameBarcode(i.barcode,code) && i.id!==itemId);
    if(dup) toast('Heads up: \u201C'+dup.name+'\u201D already uses this barcode.', true);
    else toast('Barcode saved in the form: '+code);
  });
}

function scanSheetMain(){
  const billing = SC.mode==='bill';
  return `
    ${billing ? `<div class="sc-last empty" id="sc-last">Nothing scanned yet</div>` : ''}
    <div class="sc-row">
      <button class="sc-ghost" onclick="APP.scanTypeNumber()">\u2328 Type number</button>
      ${billing ? `<button class="sc-done" onclick="APP.closeScanner()">Done \u00B7 <span id="sc-total">${money(cartSubtotal())}</span></button>`
                : `<button class="sc-done" onclick="APP.closeScanner()">Cancel</button>`}
    </div>`;
}
function openScanner(mode, cb){
  stopScannerStream();
  SC.mode=mode||'bill'; SC.cb=cb||null; SC.cand=null; SC.hold=null; SC.paused=false; SC.unknown=null; SC.torch=false; SC.lastItemId=null;
  if(SC.native===null){
    SC.native=false;
    if('BarcodeDetector' in window){ try{ SC.native=new window.BarcodeDetector(); }catch(e){ SC.native=false; } }
  }
  const title = SC.mode==='bill' ? 'Scan items to bill' : SC.mode==='search' ? 'Scan to find an item' : 'Scan to save barcode';
  const el=document.getElementById('scanner');
  el.className='';
  el.innerHTML = `
    <video id="scan-video" playsinline muted autoplay></video>
    <div class="sc-top">
      <button class="sc-round" onclick="APP.closeScanner()" aria-label="Close">\u2715</button>
      <div class="sc-title">${title}</div>
      <button class="sc-round" id="sc-torch" onclick="APP.toggleTorch()" style="visibility:hidden" aria-label="Torch">\uD83D\uDD26</button>
    </div>
    <div class="sc-view"><div class="sc-frame" id="scan-frame"><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i><span class="sc-line"></span></div></div>
    <div class="sc-sheet" id="sc-sheet">
      <div class="sc-msg" id="scan-status">Starting camera\u2026</div>
      <div id="sc-dyn">${scanSheetMain()}</div>
    </div>`;
  el.style.display='block';
  document.body.classList.add('scanning');
  startScanner();
}
function stopScannerStream(){
  SC.active=false;
  if(SC.timer){ clearTimeout(SC.timer); SC.timer=null; }
  if(SC.stream){ SC.stream.getTracks().forEach(t=>t.stop()); SC.stream=null; }
  SC.track=null;
}
function closeScanner(){
  stopScannerStream();
  const el=document.getElementById('scanner');
  el.style.display='none'; el.innerHTML='';
  document.body.classList.remove('scanning');
  if(UI.view==='billing') refreshCartTotals();
}
function scanRetry(){ openScanner(SC.mode, SC.cb); }
function scanStatus(msg, isErr){
  const el=document.getElementById('scan-status');
  if(el){ el.textContent=msg; el.style.color=isErr?'var(--rust)':''; }
}
function flash(kind){
  const f=document.getElementById('scan-frame'); if(!f) return;
  f.classList.remove('ok','bad'); void f.offsetWidth; f.classList.add(kind);
  setTimeout(()=>f.classList.remove(kind), 450);
}
function toggleTorch(){
  if(!SC.track) return;
  SC.torch=!SC.torch;
  SC.track.applyConstraints({advanced:[{torch:SC.torch}]}).catch(()=>{ SC.torch=false; });
  const b=document.getElementById('sc-torch'); if(b) b.classList.toggle('on', SC.torch);
}

/* ---------- what happens when a code is read ---------- */
function updateScanSheet(){
  const last=document.getElementById('sc-last'), tot=document.getElementById('sc-total');
  if(tot) tot.textContent=money(cartSubtotal());
  if(!last) return;
  const it=getItem(SC.lastItemId), line=CART.find(c=>c.itemId===SC.lastItemId);
  if(!it || !line){ last.className='sc-last empty'; last.textContent='Nothing scanned yet'; return; }
  last.className='sc-last';
  last.innerHTML=`<span>\u2713 <b>${esc(it.name)}</b> \u00D7 ${line.qty}</span><button class="sc-plus" onclick="APP.scanPlus()">+1</button>`;
}
function scanPlus(){
  const r=addToCart(SC.lastItemId,{quiet:true});
  if(r.ok){ beep(); updateScanSheet(); } else { beepBad(); scanStatus(r.msg,true); }
}
function handleScan(code){
  code=String(code||'').trim(); if(!code) return;
  if(SC.mode!=='bill'){ flash('ok'); beep(); buzz(60); const cb=SC.cb; closeScanner(); if(cb) cb(code); return; }
  const it=findItemByCode(code);
  if(!it){ flash('bad'); beepBad(); buzz([60,40,60]); showUnknown(code); return; }
  const r=addToCart(it.id,{quiet:true});
  if(!r.ok){ flash('bad'); beepBad(); buzz([60,40,60]); scanStatus(r.msg,true); return; }
  flash('ok'); beep(); buzz(60);
  SC.lastItemId=it.id; scanStatus('Added '+it.name); updateScanSheet();
}
function showUnknown(code){
  SC.paused=true; SC.unknown=code;
  document.getElementById('sc-dyn').innerHTML=`
    <div class="sc-unknown"><b>${esc(code)}</b><br>This barcode isn\u2019t in your items yet.</div>
    <div class="sc-row">
      <button class="sc-ghost" onclick="APP.scanResume()">Keep scanning</button>
      <button class="sc-done" onclick="APP.scanAddUnknown()">Add this item</button>
    </div>`;
  scanStatus('Not found', true);
}
function scanResume(){
  SC.paused=false; SC.hold={code:SC.unknown, seenAt:Date.now()}; SC.unknown=null;
  document.getElementById('sc-dyn').innerHTML=scanSheetMain();
  scanStatus('Point the camera at the next barcode'); updateScanSheet();
}
function scanAddUnknown(){
  const code=SC.unknown; closeScanner();
  openItemModal(null,{barcode:code, fromBilling:true});
}
function scanTypeNumber(){
  SC.paused=true;
  document.getElementById('sc-dyn').innerHTML=`
    <div class="sc-typed">
      <input id="scan-typed" inputmode="numeric" placeholder="Type the barcode number" onkeydown="if(event.key==='Enter'){APP.scanTypedSubmit();}">
      <button class="sc-done" style="flex:none;padding:0 18px;" onclick="APP.scanTypedSubmit()">OK</button>
    </div>
    <button class="sc-ghost" style="width:100%;margin-top:8px;" onclick="APP.scanTypedCancel()">Back to camera</button>`;
  setTimeout(()=>{ const i=document.getElementById('scan-typed'); if(i) i.focus(); }, 50);
}
function scanTypedCancel(){ SC.paused=false; document.getElementById('sc-dyn').innerHTML=scanSheetMain(); updateScanSheet(); }
function scanTypedSubmit(){
  const v=(document.getElementById('scan-typed')||{}).value; if(!v||!v.trim()) return;
  SC.paused=false; if(SC.mode==='bill') document.getElementById('sc-dyn').innerHTML=scanSheetMain();
  handleScan(v.trim());
  if(SC.mode==='bill' && !SC.unknown) updateScanSheet();
}

/* ---------- camera loop ---------- */
/* Devices disagree on which constraints they'll accept without throwing
   OverconstrainedError, so we try the best set first and fall back to
   plainer ones instead of giving up after one rejected attempt. */
const CAMERA_CONSTRAINT_ATTEMPTS = [
  { video:{ facingMode:{exact:'environment'}, width:{ideal:1920}, height:{ideal:1080} }, audio:false },
  { video:{ facingMode:{ideal:'environment'} }, audio:false },
  { video:{ facingMode:'environment' }, audio:false },
  { video:true, audio:false }
];
async function getCameraStream(){
  let lastErr=null;
  for(const c of CAMERA_CONSTRAINT_ATTEMPTS){
    try{ return await navigator.mediaDevices.getUserMedia(c); }
    catch(e){ lastErr=e; if(e && e.name==='NotAllowedError') throw e; /* don't keep asking if the person said no */ }
  }
  throw lastErr || new Error('no camera');
}
async function startScanner(){
  if(!liveCameraPossible()){ showCameraProblem(null); return; }
  SC.active=true;
  try{
    const stream=await getCameraStream();
    const video=document.getElementById('scan-video');
    if(!SC.active || !video){ stream.getTracks().forEach(t=>t.stop()); return; }
    SC.stream=stream; SC.track=stream.getVideoTracks()[0];
    video.muted=true; video.defaultMuted=true; video.playsInline=true;
    video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
    video.srcObject=stream;

    // Some phones grant the permission but then never deliver a frame
    // (silently stuck instead of throwing). Watch for that and offer a
    // manual "tap to start" instead of leaving the person staring at black.
    let gotFrame=false;
    const onPlaying=()=>{ gotFrame=true; };
    video.addEventListener('loadedmetadata', onPlaying, {once:true});
    try{ await video.play(); }catch(playErr){ /* often needs a user tap on some phones; handled by the watchdog below */ }
    scanStatus(SC.mode==='bill' ? 'Point the camera at a barcode \u2014 items are added automatically' : 'Point the camera at a barcode');
    setTimeout(()=>{
      if(!SC.active || gotFrame || video.videoWidth>0) return;
      showTapToStart(video, stream);
    }, 2200);

    try{
      const caps=SC.track.getCapabilities ? SC.track.getCapabilities() : {};
      if(caps.focusMode && caps.focusMode.indexOf('continuous')>=0) await SC.track.applyConstraints({advanced:[{focusMode:'continuous'}]});
      if(caps.torch){ const tb=document.getElementById('sc-torch'); if(tb) tb.style.visibility='visible'; }
    }catch(e){ /* optional camera extras */ }

    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{
      if(!SC.active) return;
      try{
        if(!SC.paused && video.readyState>=2 && video.videoWidth){
          let code=null, sure=false;
          if(SC.native){
            try{ const c=await SC.native.detect(video); if(c && c.length){ code=c[0].rawValue; sure=true; } }catch(e){}
          }
          if(!code){
            const vw=video.videoWidth, vh=video.videoHeight, sc=Math.min(1, 1100/Math.max(vw,vh));
            canvas.width=Math.round(vw*sc); canvas.height=Math.round(vh*sc);
            ctx.drawImage(video,0,0,canvas.width,canvas.height);
            const r=BC.decodeGray(toGray(ctx.getImageData(0,0,canvas.width,canvas.height)), canvas.width, canvas.height, {angles:[0,90,10,-10,80,100,22,-22], density:12});
            if(r) code=r.text;
          }
          const now=Date.now();
          if(code){
            if(SC.hold && SC.hold.code===code && now-SC.hold.seenAt<900){ SC.hold.seenAt=now; }   // same pack still in view
            else if(sure || (SC.cand && SC.cand.code===code && now-SC.cand.at<2500)){
              SC.hold={code, seenAt:now}; SC.cand=null; handleScan(code);
            } else { SC.cand={code, at:now}; }
          }
        }
      }catch(e){ /* keep going */ }
      if(SC.active) SC.timer=setTimeout(tick, 60);
    };
    tick();
  }catch(err){ showCameraProblem(err); }
}

/* ---------- camera granted but stuck black: offer a manual tap ---------- */
function showTapToStart(video, stream){
  if(document.getElementById('sc-tap')) return;
  const live=stream.getVideoTracks()[0], state=live?live.readyState:'?';
  const btn=document.createElement('button');
  btn.id='sc-tap'; btn.className='sc-tap';
  btn.innerHTML='\u25B6<span>Tap to start camera</span>';
  btn.onclick=async()=>{
    btn.disabled=true; btn.querySelector('span').textContent='Starting\u2026';
    try{ await video.play(); }catch(e){}
    setTimeout(()=>{
      if(video.videoWidth>0){ btn.remove(); }
      else {
        scanStatus('Still no picture from the camera (track: '+state+'). Try "Try again", or use the photo / Bluetooth options below.', true);
        btn.remove();
        showCameraProblem({name:'NoFrame'});
      }
    }, 900);
  };
  const stage=document.getElementById('scanner'); if(stage) stage.appendChild(btn);
  scanStatus('Camera connected but no picture yet \u2014 tap the button to start it.', true);
}

/* ---------- when the camera can't start: say exactly why ---------- */
function showCameraProblem(err){
  stopScannerStream();
  const el=document.getElementById('scanner'); if(el) el.className='bad';
  const n=(err&&err.name)||'', proto=location.protocol, secure=!!window.isSecureContext;
  const ua=navigator.userAgent||'';
  const inApp=/FBAN|FBAV|Instagram|WhatsApp|Snapchat|Telegram|; wv\)/i.test(ua);
  let title, why, steps;
  let extra='';
  if(!liveCameraPossible()){
    title='Live camera can\u2019t start when the app is opened this way';
    why=(proto==='content:'||proto==='file:')
      ? 'The app was opened as a file from your phone\u2019s storage. Phone browsers only give the camera to pages opened from a secure https link.'
      : 'This page isn\u2019t loaded over https, so the browser hides the camera from it.';
    const fname=decodeURIComponent((location.pathname||'').split('/').pop()||'Counter-Shop-Manager.html');
    steps=[];
    if(proto==='content:'){
      steps.push('Quickest thing to try: open <b>Chrome</b>, paste the address below into the address bar and open it. Change the folder if you saved the file somewhere other than Downloads, and allow file access if Chrome asks.');
      extra='<div class="sc-copy"><input id="sc-addr" readonly value="'+esc('file:///sdcard/Download/'+fname)+'" onclick="this.select()"><button onclick="APP.copyAddr()">Copy</button></div>';
    }
    steps.push('Best long-term fix: put the app on a free https link (drag it onto <b>app.netlify.com/drop</b>) and open that link in Chrome \u2192 menu \u2192 Install app. Steps are in HOW-TO-INSTALL.txt.');
    steps.push('Bluetooth / USB barcode scanners work in every setup, with no camera needed.');
    steps.push('Or type the barcode number.');
  } else if(n==='NoFrame'){
    title='Camera opened but sent no picture';
    why='Chrome allowed the camera, but this phone\u2019s camera driver didn\u2019t deliver any video to the page \u2014 a known quirk on some Android phones with web pages opened from local files.';
    steps=['Tap Try again \u2014 it often works on the 2nd attempt.',
           'Close any other app that might be holding the camera (camera app, video call, another browser tab), then try again.',
           'Best fix: open the app from an https link instead (see HOW-TO-INSTALL.txt) \u2014 this problem does not happen there.',
           'Bluetooth / USB scanner or typing the number always work meanwhile.'];
  } else if(n==='NotAllowedError' || n==='SecurityError'){
    title='Camera permission is blocked';
    why='The browser was told not to let this page use the camera.';
    steps=['Tap the lock or settings icon next to the address bar \u2192 Permissions \u2192 Camera \u2192 Allow.','Then tap Try again.'];
  } else if(n==='NotFoundError' || n==='OverconstrainedError'){
    title='No camera was found'; why='This device didn\u2019t report a usable camera.';
    steps=['Check the camera works in your normal camera app.','Then tap Try again.'];
  } else if(n==='NotReadableError'){
    title='The camera is busy'; why='Another app is using the camera right now.';
    steps=['Close other apps that use the camera (camera, video calls, torch).','Then tap Try again.'];
  } else { title='The camera didn\u2019t start'; why='The browser reported: '+(n||'unknown error')+'.'; steps=['Tap Try again.','If it keeps failing, use a Bluetooth / USB scanner or type the number.']; }
  if(inApp) steps.unshift('You look to be inside another app\u2019s built-in browser \u2014 open this page in Chrome instead.');
  const sheet=document.getElementById('sc-sheet');
  if(!sheet) return;
  sheet.innerHTML=`
    <div class="sc-problem">

      <div class="sc-tech">page: ${esc(proto)} \u00B7 secure: ${secure?'yes':'no'}${n?' \u00B7 error: '+esc(n):''}</div>

        <input type="file" accept="image/*" capture="environment" onchange="APP.scannerPhoto(this.files[0]); this.value='';">
      </label>
    </div>`;
}

/* ---------- photo fallback (only offered when live camera is unavailable) ---------- */
function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ resolve(img); setTimeout(()=>URL.revokeObjectURL(url),8000); };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src=url;
  });
}
async function loadBitmap(file){
  if(window.createImageBitmap){ try{ return await createImageBitmap(file); }catch(e){} }
  return loadImageFromFile(file);
}
async function scannerPhoto(file){
  if(!file) return;
  scanStatus('Reading your photo\u2026');
  try{
    const bmp=await loadBitmap(file);
    const W=bmp.naturalWidth||bmp.width, H=bmp.naturalHeight||bmp.height;
    let code=null;
    if(SC.native){ try{ const c=await SC.native.detect(bmp); if(c&&c.length) code=c[0].rawValue; }catch(e){} }
    if(!code){
      const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true}), tried={};
      for(const maxSide of [1600,2600,1000,3300]){
        const sc=Math.min(1, maxSide/Math.max(W,H)), key=sc.toFixed(3); if(tried[key]) continue; tried[key]=1;
        canvas.width=Math.round(W*sc); canvas.height=Math.round(H*sc);
        ctx.drawImage(bmp,0,0,canvas.width,canvas.height);
        const r=BC.decodeGray(toGray(ctx.getImageData(0,0,canvas.width,canvas.height)),canvas.width,canvas.height,{density:18});
        if(r){ code=r.text; break; }
        await new Promise(r=>setTimeout(r,10));
      }
    }
    if(bmp.close) try{ bmp.close(); }catch(e){}
    if(code){ SC.paused=false; if(SC.mode==='bill'){ closeScanner(); openScanner('bill'); } handleScan(code); return; }
    scanStatus('Couldn\u2019t find a barcode in that photo. Get closer, keep it sharp and well lit, and try again.', true);
  }catch(e){ scanStatus('Couldn\u2019t open that photo.', true); }
}

/* ============================================================
   HARDWARE SCANNER (Bluetooth / USB) — works without tapping anything
   A scanner "types" the digits very fast and presses Enter. We catch
   that even when no box is focused, on New Sale and Items.
   ============================================================ */
const KB={buf:'', last:0};
function onHardwareScan(code){
  if(UI.view==='billing') posScanEnter(code);
  else if(UI.view==='items') itemsScanResult(code);
}
document.addEventListener('keydown', function(e){
  const app=document.getElementById('app');
  if(!app || !app.classList.contains('show')) return;
  if(document.getElementById('scanner').style.display==='block') return;
  if(document.getElementById('modal-bg').classList.contains('show')) return;
  const t=e.target, tag=(t&&t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const now=Date.now();
  if(e.key==='Enter'){
    const code=KB.buf; KB.buf='';
    if(code.length>=4 && now-KB.last<150){ e.preventDefault(); onHardwareScan(code); }
    return;
  }
  if(e.key && e.key.length===1){
    if(now-KB.last>100) KB.buf='';
    KB.buf+=e.key; KB.last=now;
  }
});

/* ============================================================
   IMPORT ITEMS FROM EXCEL / CSV (like Zobaze's bulk import)
   ============================================================ */
function parseCSV(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim = (first.split('\t').length>first.split(',').length) ? '\t' : (first.split(';').length>first.split(',').length ? ';' : ',');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c;
    } else if(c==='"') q=true;
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c==='\r'){ /* skip */ }
    else cell+=c;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const IMPORT_COLS={
  name:['name','itemname','item','product','productname','description'],
  category:['category','group','type'],
  unit:['unit','uom'],
  barcode:['barcode','barcodenumber','ean','upc','barcodeno'],
  sku:['sku','itemcode','code'],
  purchase:['purchaseprice','costprice','cost','cp','purchase','buyingprice'],
  sale:['saleprice','sellingprice','salesprice','price','sp','rate','mrp'],
  stock:['stock','openingstock','quantity','qty','currentstock'],
  low:['lowstock','lowstockalert','reorderlevel','minstock'],
  wholesale:['wholesaleprice','wholesale'],
  wholesaleMin:['wholesaleminqty','wholesalemin','minqty']
};
let IMPORT_PLAN=null;
function openImportModal(){
  IMPORT_PLAN=null;
  setModal(`
    <button class="close" onclick="APP.closeModal()">&times;</button>
    <h3>Import items from Excel / CSV</h3>
    <div class="desc">Bring in a whole list of items and their barcodes at once. In Excel: <b>File \u2192 Save As \u2192 CSV</b>, then choose that file here.</div>
    <div class="field"><label>Columns it understands</label>
      <div class="hint">name, category, unit, barcode, sku, purchase price, sale price, stock, low stock, wholesale price. Only <b>name</b> and <b>sale price</b> are required.</div>
    </div>
    <button class="btn btn-sm" onclick="APP.downloadTemplate()">Download sample CSV</button>
    <div class="field" style="margin-top:14px;"><label>Choose your CSV file</label><input type="file" accept=".csv,.txt,text/csv" onchange="APP.importFileChosen(this.files[0])"></div>
    <div class="field" style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="imp-stock" style="width:auto;"><label style="margin:0;">Also overwrite stock quantity of items that already exist</label></div>
    <div id="imp-preview"></div>
    <div class="modal-actions"><button class="btn" onclick="APP.closeModal()">Close</button><button class="btn btn-primary" id="imp-go" disabled onclick="APP.confirmImport()">Import</button></div>
  `);
}
function downloadTemplate(){
  const csv='name,category,unit,barcode,purchase price,sale price,stock,low stock\nSample Salt 1kg,Grocery,pcs,8900000000011,24,28,24,5\nSample Toothpaste,Household,pcs,8900000000028,45,55,12,4\n';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='items-sample.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function importFileChosen(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=e=>{
    const rows=parseCSV(e.target.result);
    const prev=document.getElementById('imp-preview'), go=document.getElementById('imp-go');
    if(rows.length<2){ prev.innerHTML='<div class="form-err">That file has no item rows.</div>'; go.disabled=true; return; }
    const norm=h=>String(h).toLowerCase().replace(/[^a-z]/g,'');
    const head=rows[0].map(norm), idx={};
    Object.keys(IMPORT_COLS).forEach(k=>{ for(const alias of IMPORT_COLS[k]){ const p=head.indexOf(alias); if(p>=0){ idx[k]=p; break; } } });
    if(idx.name===undefined || idx.sale===undefined){ prev.innerHTML='<div class="form-err">I couldn\u2019t find a \u201Cname\u201D and a \u201Csale price\u201D column in the first row.</div>'; go.disabled=true; return; }
    const get=(r,k)=> idx[k]===undefined ? '' : String(r[idx[k]]||'').trim();
    const num=v=>{ const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; };
    const plan={add:[],update:[],skipped:0};
    rows.slice(1).forEach(r=>{
      const name=get(r,'name'), sale=num(get(r,'sale'));
      if(!name || sale===null || sale<=0){ if(name||sale!==null) plan.skipped++; return; }
      const barcode=get(r,'barcode');
      const data={ name, salePrice:sale, category:get(r,'category')||'General', unit:get(r,'unit')||'pcs', barcode, sku:get(r,'sku'),
        purchasePrice:num(get(r,'purchase')), stock:num(get(r,'stock')), lowStockAlert:num(get(r,'low')),
        wholesalePrice:num(get(r,'wholesale')), wholesaleMinQty:num(get(r,'wholesaleMin')) };
      const existing=(barcode && DB.items.find(i=>sameBarcode(i.barcode,barcode))) || DB.items.find(i=>i.name.toLowerCase()===name.toLowerCase());
      if(existing) plan.update.push({existing,data}); else plan.add.push(data);
    });
    IMPORT_PLAN=plan;
    prev.innerHTML=`<div class="card" style="margin-top:6px;"><b>${plan.add.length}</b> new item(s) \u00B7 <b>${plan.update.length}</b> existing item(s) will be updated \u00B7 ${plan.skipped} skipped (missing name or price)
      ${plan.add.length?`<div class="hint" style="margin-top:6px;">e.g. ${plan.add.slice(0,3).map(d=>esc(d.name)).join(', ')}${plan.add.length>3?'\u2026':''}</div>`:''}</div>`;
    go.disabled=!(plan.add.length||plan.update.length);
  };
  rd.readAsText(file);
}
function confirmImport(){
  if(!IMPORT_PLAN) return;
  const overwriteStock=document.getElementById('imp-stock').checked;
  const addCat=c=>{ if(c && !DB.categories.includes(c)) DB.categories.push(c); };
  const addUnit=u=>{ if(u && !DB.units.includes(u)) DB.units.push(u); };
  IMPORT_PLAN.add.forEach(d=>{
    addCat(d.category); addUnit(d.unit);
    DB.items.push({ id:uid('it'), name:d.name, category:d.category, unit:d.unit, sku:d.sku, barcode:d.barcode,
      purchasePrice:d.purchasePrice||0, salePrice:d.salePrice, stock:Math.max(0,Math.round(d.stock||0)),
      lowStockAlert:d.lowStockAlert!=null?Math.round(d.lowStockAlert):DB.settings.lowStockDefault,
      wholesalePrice:d.wholesalePrice, wholesaleMinQty:d.wholesaleMinQty, trackStock:true, createdAt:nowISO() });
  });
  IMPORT_PLAN.update.forEach(u=>{
    const it=u.existing, d=u.data;
    addCat(d.category); addUnit(d.unit);
    it.salePrice=d.salePrice; it.category=d.category; it.unit=d.unit;
    if(d.barcode) it.barcode=d.barcode; if(d.sku) it.sku=d.sku;
    if(d.purchasePrice!=null) it.purchasePrice=d.purchasePrice;
    if(d.lowStockAlert!=null) it.lowStockAlert=Math.round(d.lowStockAlert);
    if(d.wholesalePrice!=null) it.wholesalePrice=d.wholesalePrice;
    if(d.wholesaleMinQty!=null) it.wholesaleMinQty=d.wholesaleMinQty;
    if(overwriteStock && d.stock!=null) it.stock=Math.max(0,Math.round(d.stock));
  });
  const n=IMPORT_PLAN.add.length+IMPORT_PLAN.update.length;
  IMPORT_PLAN=null; persist(); closeModal(); render(); toast('Imported '+n+' item(s).');
}

/* ============================================================
   SHARE RECEIPT ON WHATSAPP
   ============================================================ */
function shareWhatsApp(saleId){
  const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
  const party=s.partyId?getParty(s.partyId):null;
  const lines=[];
  lines.push('*'+(DB.business.name||'Receipt')+'*');
  if(DB.business.address) lines.push(DB.business.address);
  lines.push(s.invoiceNo+' \u00B7 '+fmtDate(s.date));
  if(party) lines.push('Customer: '+party.name);
  lines.push('------------------------');
  s.items.forEach(i=>lines.push(i.name+'  '+i.qty+' \u00D7 '+money(i.price)+' = '+money(i.total)));
  lines.push('------------------------');
  if(s.discount>0) lines.push('Discount: -'+money(s.discount));
  lines.push('*Total: '+money(s.total)+'*');
  lines.push('Paid ('+s.mode+'): '+money(s.paid));
  if(s.due>0) lines.push('*Balance due: '+money(s.due)+'*');
  lines.push('Thank you! Visit again.');
  let phone=(party&&party.phone||'').replace(/\D/g,'');
  if(phone.length===10) phone='91'+phone;
  const url='https://wa.me/'+phone+'?text='+encodeURIComponent(lines.join('\n'));
  window.open(url,'_blank');
}
